<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life OS Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0A0A0F; color: #E8E8F0; font-family: 'DM Sans', 'Segoe UI', sans-serif; }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: #111; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
.hbtn { transition: all 0.2s ease; cursor: pointer; border: none; }
.hbtn:hover { transform: scale(1.05); }
.nbtn { transition: all 0.2s; cursor: pointer; border: none; background: none; }
.card { background: #13131A; border: 1px solid #1E1E2E; border-radius: 16px; }
input, select { outline: none; font-family: inherit; }
.cday:hover { background: #1E1E2E !important; cursor: pointer; }
.go { box-shadow: 0 0 20px rgba(255,107,53,0.15); }
.gt { box-shadow: 0 0 20px rgba(78,205,196,0.15); }
.gp { box-shadow: 0 0 20px rgba(138,43,226,0.12); }
@keyframes fi { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.fin { animation: fi 0.3s ease; }
.dbtn:hover { color: #FF6B6B !important; }
.epicker { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:999; display:flex; align-items:center; justify-content:center; }
.epicker-box { background:#13131A; border:1px solid #1E1E2E; border-radius:16px; padding:16px; width:320px; max-height:400px; overflow-y:auto; }
.todo-item:hover .todo-del { opacity:1!important; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const ES = navigator.language.startsWith("es");
const CURRENCIES = ["$","€","£","A$","¥"];

const T = ES ? {
  today:"Hoy", week:"Semana", month:"Mes", todayDot:"● HOY",
  personal:"Dashboard Personal", settings:"⚙️ Configuración", back:"← Volver",
  habDay:"Hábitos del día", noHab:"Sin hábitos — ve a ⚙️ para añadir",
  income:"💰 Ingresos", expenses:"💸 Gastos", add:"+ Añadir",
  amount:"Cantidad", note:"Nota (opcional)", save:"Guardar", cancel:"Cancelar",
  noInc:"Sin ingresos registrados", noExp:"Sin gastos registrados",
  expWord:"Gasto", balance:"Balance del día",
  weekHab:"Hábitos semanales", habitWord:"Hábito", thisWeek:"esta semana",
  savGoal:"🎯 Objetivo de ahorro", ofGoal:"% del objetivo",
  calendar:"Calendario", habMonth:"Hábitos del mes", dailyExp:"Gastos por día",
  incLabel:"Ingresos", expLabel:"Gastos", savLabel:"Ahorro", habLabel:"Hábitos",
  general:"🎨 General", appName:"Nombre de la app", goalLabel:"Objetivo ahorro mensual",
  habTab:"🏆 Hábitos", incTab:"💰 Fuentes de ingreso",
  newHab:"➕ Nuevo hábito", nameLabel:"Nombre", habPlaceholder:"Ej: Meditación",
  addHab:"+ Añadir hábito", habCount:"Hábitos",
  newSrc:"➕ Nueva fuente", srcPlaceholder:"Ej: Uber, Freelance...",
  addSrc:"+ Añadir fuente", srcCount:"Fuentes",
  habLegend:"🟠 Hábitos", incDot:"● Ingresos", expDot:"● Gastos",
  todo:"📝 Tareas del día", todoPlaceholder:"Añadir tarea...", noTodo:"Sin tareas",
  currency:"Moneda",
  months:["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"],
  days:["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"],
  defHabits:[
    {id:"gym",label:"Gimnasio",icon:"🏋️",color:"#FF6B35"},
    {id:"stretch",label:"Estirar",icon:"🧘",color:"#4ECDC4"},
    {id:"sport",label:"Deporte",icon:"🏊",color:"#45B7D1"},
    {id:"read",label:"Leer",icon:"📚",color:"#96CEB4"},

    {id:"water",label:"Hidratación",icon:"💧",color:"#5DADE2"},
    {id:"trading",label:"Trading",icon:"📈",color:"#F0B27A"},
  ],
  defIncome:[
    {id:"src1",label:"Trabajo",icon:"💼",color:"#4ECDC4"},
    {id:"src2",label:"Freelance",icon:"💻",color:"#FF6B35"},
    {id:"src3",label:"Inversiones",icon:"📈",color:"#F0B27A"},
    {id:"src4",label:"Otro",icon:"💰",color:"#DDA0DD"},
  ],
} : {
  today:"Today", week:"Week", month:"Month", todayDot:"● TODAY",
  personal:"Personal Dashboard", settings:"⚙️ Settings", back:"← Back",
  habDay:"Habits of the day", noHab:"No habits — go to ⚙️ to add",
  income:"💰 Income", expenses:"💸 Expenses", add:"+ Add",
  amount:"Amount", note:"Note (optional)", save:"Save", cancel:"Cancel",
  noInc:"No income registered", noExp:"No expenses registered",
  expWord:"Expense", balance:"Daily balance",
  weekHab:"Weekly habits", habitWord:"Habit", thisWeek:"this week",
  savGoal:"🎯 Savings goal", ofGoal:"% of goal",
  calendar:"Calendar", habMonth:"Monthly habits", dailyExp:"Daily expenses",
  incLabel:"Income", expLabel:"Expenses", savLabel:"Savings", habLabel:"Habits",
  general:"🎨 General", appName:"App name", goalLabel:"Monthly savings goal",
  habTab:"🏆 Habits", incTab:"💰 Income sources",
  newHab:"➕ New habit", nameLabel:"Name", habPlaceholder:"E.g: Meditation",
  addHab:"+ Add habit", habCount:"Habits",
  newSrc:"➕ New source", srcPlaceholder:"E.g: Uber, Freelance...",
  addSrc:"+ Add source", srcCount:"Sources",
  habLegend:"🟠 Habits", incDot:"● Income", expDot:"● Expenses",
  todo:"📝 Tasks of the day", todoPlaceholder:"Add task...", noTodo:"No tasks",
  currency:"Currency",
  months:["January","February","March","April","May","June","July","August","September","October","November","December"],
  days:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
  defHabits:[
    {id:"gym",label:"Gym",icon:"🏋️",color:"#FF6B35"},
    {id:"stretch",label:"Stretching",icon:"🧘",color:"#4ECDC4"},
    {id:"sport",label:"Sport",icon:"🏊",color:"#45B7D1"},
    {id:"read",label:"Reading",icon:"📚",color:"#96CEB4"},
    {id:"projects",label:"Projects",icon:"⚡",color:"#FFEAA7"},
    {id:"entrepreneurship",label:"Entrepreneurship",icon:"🚀",color:"#DDA0DD"},
    {id:"platform",label:"Platform",icon:"💻",color:"#98D8C8"},
    {id:"meditation",label:"Meditation",icon:"🧠",color:"#F7DC6F"},
    {id:"nutrition",label:"Nutrition",icon:"🥗",color:"#82E0AA"},
    {id:"sleep",label:"Sleep 8h",icon:"😴",color:"#AED6F1"},
    {id:"water",label:"Hydration",icon:"💧",color:"#5DADE2"},
    {id:"trading",label:"Trading",icon:"📈",color:"#F0B27A"},
  ],
  defIncome:[
    {id:"src1",label:"Work",icon:"💼",color:"#4ECDC4"},
    {id:"src2",label:"Freelance",icon:"💻",color:"#FF6B35"},
    {id:"src3",label:"Investments",icon:"📈",color:"#F0B27A"},
    {id:"src4",label:"Other",icon:"💰",color:"#DDA0DD"},
  ],
};

const COLORS = ["#FF6B35","#4ECDC4","#45B7D1","#96CEB4","#FFEAA7","#DDA0DD","#98D8C8","#F7DC6F","#82E0AA","#AED6F1","#5DADE2","#F0B27A","#FF6B6B","#06C167","#E74C3C","#3498DB","#9B59B6","#1ABC9C","#F39C12","#2ECC71"];
const EMOJIS = [
  "🏋️","🧘","🏊","📚","⚡","🚀","💻","🧠","🥗","😴","💧","📈","🎯","🏃","🎨","✍️","🎸","💪","🌿","🍎","📖","💼","🔑","🚙","💰","🌙","☀️","🏆","🎮","🏄",
  "🧗","🚴","🥊","⚽","🏀","🎾","🏈","🎿","🤸","🧜","🧘","🏇","🎭","🎬","🎤","🎧","🎼","🎹","🥁","🎷","🎺","🎻","🪕","🎲","♟️","🧩","🃏","🎴","🀄",
  "🍕","🍔","🥗","🍜","🍱","🍣","🥩","🍳","☕","🧃","🥤","🍵","🧋","🥛","🍺","🍷","🧁","🍰","🍫","🍬",
  "✈️","🏖️","🏔️","🌴","🗺️","🧳","🏕️","🎡","🎢","🎠","🗼","🗽","🏰","⛩️","🕌","🏛️","🎑","🌃","🌆","🌇",
  "💊","🏥","🩺","🧬","💉","🩹","🧪","🔬","🔭","📡","🛸","🤖","👾","🕹️","💾","📱","💻","🖥️","⌨️","🖱️",
  "🌱","🌸","🌺","🌻","🌹","🍀","🌾","🍁","🍂","🍃","🌊","🌈","⭐","🌙","☀️","❄️","🔥","💫","✨","🌟",
  "❤️","🧡","💛","💚","💙","💜","🖤","🤍","💔","💕","💞","💓","💗","💖","💘","💝","🎁","🎀","🎊","🎉",
  "🏠","🏡","🏢","🏗️","🔑","🪴","🛋️","🪑","🛏️","🚿","🛁","🪞","🪟","🧹","🧺","🧻","🪣","🔧","🔨","🪛",
  "👔","👗","👠","👟","👒","🎩","👜","💍","💄","💅","👓","🕶️","🧣","🧤","🧥","🪖","👑","💎","🪬","🧲"
];

const getDIM = (y,m) => new Date(y,m+1,0).getDate();
const getFD = (y,m) => new Date(y,m,1).getDay();
const fmt = (d) => { const o=d.getTimezoneOffset(); return new Date(d.getTime()-o*60000).toISOString().split("T")[0]; };
const today = fmt(new Date());
const uid = () => Math.random().toString(36).substr(2,9);

function EmojiPicker({onSelect, onClose}) {
  return (
    <div className="epicker" onClick={onClose}>
      <div className="epicker-box" onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
          {EMOJIS.map(e=>(
            <button key={e} className="nbtn" onClick={()=>onSelect(e)}
              style={{fontSize:22,padding:"4px",borderRadius:8,background:"transparent",border:"none",cursor:"pointer",lineHeight:1}}>
              {e}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = React.useState("daily");
  const [sel, setSel] = React.useState(today);
  const [td, setTd] = React.useState({});
  const [habits, setHabits] = React.useState(T.defHabits);
  const [inc, setInc] = React.useState(T.defIncome);
  const [goal, setGoal] = React.useState(2000);
  const [name, setName] = React.useState("Life OS");
  const [addE, setAddE] = React.useState(false);
  const [addI, setAddI] = React.useState(false);
  const [eForm, setEForm] = React.useState({amount:"",note:"",currency:"$"});
  const [iForm, setIForm] = React.useState({source:"",amount:"",note:"",currency:"$"});
  const [todoInput, setTodoInput] = React.useState("");
  const [cm, setCm] = React.useState(new Date().getMonth());
  const [cy, setCy] = React.useState(new Date().getFullYear());
  const [stab, setStab] = React.useState("habits");
  const [nH, setNH] = React.useState({label:"",icon:"🎯",color:"#FF6B35"});
  const [nS, setNS] = React.useState({label:"",icon:"💰",color:"#4ECDC4"});
  const [eH, setEH] = React.useState(null);
  const [eS, setES] = React.useState(null);
  const [ePicker, setEPicker] = React.useState(null); // "nH" | "nS" | habitId | srcId

  React.useEffect(() => {
    try {
      const s = localStorage.getItem("lifeosv4");
      if (s) {
        const p = JSON.parse(s);
        if (p.td) setTd(p.td);
        if (p.habits) setHabits(p.habits);
        if (p.inc) setInc(p.inc);
        if (p.goal) setGoal(p.goal);
        if (p.name) setName(p.name);
      }
    } catch(e) {}
  }, []);

  const save = (patch) => {
    const next = {td, habits, inc, goal, name, ...patch};
    if (patch.td !== undefined) setTd(patch.td);
    if (patch.habits !== undefined) setHabits(patch.habits);
    if (patch.inc !== undefined) setInc(patch.inc);
    if (patch.goal !== undefined) setGoal(patch.goal);
    if (patch.name !== undefined) setName(patch.name);
    localStorage.setItem("lifeosv4", JSON.stringify(next));
  };

  const exportAll = () => {
    const blob = new Blob([JSON.stringify({td,habits,inc,goal,name},null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=`lifeos-${today}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  const importAll = (e) => {
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=(ev)=>{ try { const p=JSON.parse(ev.target.result); save({td:p.td||{},habits:p.habits||T.defHabits,inc:p.inc||T.defIncome,goal:p.goal||2000,name:p.name||"Life OS"}); alert(ES?"✅ Importado":"✅ Imported"); } catch { alert(ES?"❌ Archivo no válido":"❌ Invalid file"); }};
    r.readAsText(file);
  };

  const gd = (d) => td[d]||{habits:{},expenses:[],incomes:[],todos:[]};
  const sd = (d,v) => save({td:{...td,[d]:v}});
  const togH = (date,hid) => { const d=gd(date); sd(date,{...d,habits:{...d.habits,[hid]:!d.habits[hid]}}); };
  const doAE = () => { if(!eForm.amount) return; const d=gd(sel); sd(sel,{...d,expenses:[...(d.expenses||[]),{...eForm,amount:parseFloat(eForm.amount),id:Date.now()}]}); setEForm({amount:"",note:"",currency:"$"}); setAddE(false); };
  const doAI = () => { if(!iForm.amount) return; const d=gd(sel); const src=iForm.source||inc[0]?.id||""; sd(sel,{...d,incomes:[...(d.incomes||[]),{...iForm,source:src,amount:parseFloat(iForm.amount),id:Date.now()}]}); setIForm({source:"",amount:"",note:"",currency:"$"}); setAddI(false); };
  const delE = (date,id) => { const d=gd(date); sd(date,{...d,expenses:d.expenses.filter(e=>e.id!==id)}); };
  const delI = (date,id) => { const d=gd(date); sd(date,{...d,incomes:d.incomes.filter(i=>i.id!==id)}); };

  const addTodo = () => {
    if(!todoInput.trim()) return;
    const d=gd(sel);
    sd(sel,{...d,todos:[...(d.todos||[]),{id:Date.now(),text:todoInput,done:false}]});
    setTodoInput("");
  };
  const togTodo = (id) => { const d=gd(sel); sd(sel,{...d,todos:(d.todos||[]).map(t=>t.id===id?{...t,done:!t.done}:t)}); };
  const delTodo = (id) => { const d=gd(sel); sd(sel,{...d,todos:(d.todos||[]).filter(t=>t.id!==id)}); };

  const addH = () => { if(!nH.label.trim()) return; save({habits:[...habits,{id:uid(),label:nH.label,icon:nH.icon,color:nH.color}]}); setNH({label:"",icon:"🎯",color:"#FF6B35"}); };
  const delH = (id) => save({habits:habits.filter(h=>h.id!==id)});
  const updH = (id,f,v) => save({habits:habits.map(h=>h.id===id?{...h,[f]:v}:h)});
  const addS = () => { if(!nS.label.trim()) return; save({inc:[...inc,{id:uid(),label:nS.label,icon:nS.icon,color:nS.color}]}); setNS({label:"",icon:"💰",color:"#4ECDC4"}); };
  const delS = (id) => save({inc:inc.filter(s=>s.id!==id)});
  const updS = (id,f,v) => save({inc:inc.map(s=>s.id===id?{...s,[f]:v}:s)});

  const mDates = Array.from({length:getDIM(cy,cm)},(_,i)=>fmt(new Date(cy,cm,i+1)));
  const mData = mDates.map(d=>td[d]||{habits:{},expenses:[],incomes:[],todos:[]});
  const mExp = mData.reduce((s,d)=>s+(d.expenses||[]).reduce((a,e)=>a+e.amount,0),0);
  const mInc = mData.reduce((s,d)=>s+(d.incomes||[]).reduce((a,i)=>a+i.amount,0),0);
  const mSav = mInc-mExp;
  const hRate = (id) => mDates.length?Math.round((mDates.filter(d=>td[d]?.habits?.[id]).length/mDates.length)*100):0;
  const dExp = mDates.map(d=>({date:d,day:new Date(d+"T12:00:00").getDate(),total:(td[d]?.expenses||[]).reduce((s,e)=>s+e.amount,0)}));
  const getW = (ds) => { const dt=new Date(ds+"T12:00:00"),dy=dt.getDay(),mon=new Date(dt); mon.setDate(dt.getDate()-(dy===0?6:dy-1)); return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return fmt(d);}); };
  const wD = getW(sel);
  const dayD = gd(sel);
  const dET = (dayD.expenses||[]).reduce((s,e)=>s+e.amount,0);
  const dIT = (dayD.incomes||[]).reduce((s,i)=>s+i.amount,0);
  const dHC = habits.filter(h=>dayD.habits?.[h.id]).length;
  const fDay = getFD(cy,cm);
  const dIM = getDIM(cy,cm);

  const IS = {background:"#1A1A25",border:"1px solid #333",borderRadius:8,padding:"8px 12px",color:"#E8E8F0",fontSize:13,width:"100%"};

  const Header = () => (
    <div style={{background:"linear-gradient(135deg,#13131A,#0A0A0F)",borderBottom:"1px solid #1E1E2E",padding:"16px 24px",position:"sticky",top:0,zIndex:100}}>
      <div style={{maxWidth:900,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:11,color:"#666",fontWeight:600,letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:2}}>{T.personal}</div>
          <div style={{fontSize:20,fontWeight:700,fontFamily:"'Space Grotesk',sans-serif",background:"linear-gradient(90deg,#FF6B35,#4ECDC4)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{name}</div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          {["daily","weekly","monthly"].map(v=>(
            <button key={v} className="nbtn" onClick={()=>setView(v)} style={{padding:"7px 14px",borderRadius:10,fontSize:12,fontWeight:600,color:view===v?"#0A0A0F":"#666",background:view===v?"linear-gradient(135deg,#FF6B35,#FF8C5A)":"#1A1A25",border:view===v?"none":"1px solid #1E1E2E"}}>
              {v==="daily"?T.today:v==="weekly"?T.week:T.month}
            </button>
          ))}
          <button className="nbtn" onClick={()=>setView("settings")} style={{width:32,height:32,borderRadius:10,background:view==="settings"?"#FF6B3530":"#1A1A25",border:`1px solid ${view==="settings"?"#FF6B35":"#333"}`,color:"#888",fontSize:15,display:"flex",alignItems:"center",justifyContent:"center"}}>⚙️</button>
          <div style={{width:1,height:24,background:"#1E1E2E"}}/>
          <button className="nbtn" onClick={exportAll} style={{width:32,height:32,borderRadius:10,background:"#1A1A25",border:"1px solid #4ECDC4",color:"#4ECDC4",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>⬇</button>
          <label style={{width:32,height:32,borderRadius:10,background:"#1A1A25",border:"1px solid #FF6B35",color:"#FF6B35",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
            ⬆<input type="file" accept=".json" onChange={importAll} style={{display:"none"}}/>
          </label>
        </div>
      </div>
    </div>
  );

  if (view==="settings") return (
    <div style={{minHeight:"100vh",background:"#0A0A0F",color:"#E8E8F0"}}>
      <Header/>
      {ePicker&&<EmojiPicker onClose={()=>setEPicker(null)} onSelect={(em)=>{
        if(ePicker==="nH") setNH({...nH,icon:em});
        else if(ePicker==="nS") setNS({...nS,icon:em});
        else if(ePicker.startsWith("h-")) updH(ePicker.slice(2),"icon",em);
        else if(ePicker.startsWith("s-")) updS(ePicker.slice(2),"icon",em);
        setEPicker(null);
      }}/>}
      <div style={{maxWidth:900,margin:"0 auto",padding:"24px 16px"}}>
        <div className="card" style={{padding:20,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:"#666",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:16}}>{T.general}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div><div style={{fontSize:12,color:"#666",marginBottom:6}}>{T.appName}</div><input style={IS} value={name} onChange={e=>save({name:e.target.value})}/></div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              {["income","expense"].map(type=>{
                const total=wD.reduce((sum,d)=>{const dy=td[d]||{};return sum+(type==="income"?(dy.incomes||[]):(dy.expenses||[])).reduce((s,x)=>s+x.amount,0);},0);
                return (
                  <div key={type} className="card" style={{padding:20}}>
                    <div style={{fontSize:12,color:"#555",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>{type==="income"?T.income:T.expenses}</div>
                    <div style={{fontSize:28,fontWeight:700,fontFamily:"'Space Grotesk',sans-serif",color:type==="income"?"#4ECDC4":"#FF6B6B"}}>${total.toFixed(0)}</div>
                    <div style={{fontSize:12,color:"#444",marginTop:4}}>{T.thisWeek}</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {view==="monthly"&&(
          <div className="fin">
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
              <button className="nbtn" onClick={()=>{if(cm===0){setCm(11);setCy(y=>y-1);}else setCm(m=>m-1);}} style={{width:36,height:36,borderRadius:10,background:"#1A1A25",border:"1px solid #1E1E2E",color:"#aaa",fontSize:18}}>‹</button>
              <div style={{flex:1,textAlign:"center",fontSize:20,fontWeight:700,fontFamily:"'Space Grotesk',sans-serif"}}>{T.months[cm]} {cy}</div>
              <button className="nbtn" onClick={()=>{if(cm===11){setCm(0);setCy(y=>y+1);}else setCm(m=>m+1);}} style={{width:36,height:36,borderRadius:10,background:"#1A1A25",border:"1px solid #1E1E2E",color:"#aaa",fontSize:18}}>›</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:20}}>
              {[{l:T.incLabel,v:mInc,c:"#4ECDC4",i:"💰"},{l:T.expLabel,v:mExp,c:"#FF6B6B",i:"💸"},{l:T.savLabel,v:mSav,c:mSav>=0?"#96CEB4":"#FF6B6B",i:"🏦"}].map(s=>(
                <div key={s.l} className="card" style={{padding:16,textAlign:"center"}}>
                  <div style={{fontSize:20,marginBottom:6}}>{s.i}</div>
                  <div style={{fontSize:20,fontWeight:700,color:s.c,fontFamily:"'Space Grotesk',sans-serif"}}>${Math.abs(s.v).toFixed(0)}</div>
                  <div style={{fontSize:11,color:"#555",marginTop:2}}>{s.l}</div>
                </div>
              ))}
            </div>
            <div className="card" style={{padding:20,marginBottom:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div style={{fontSize:13,fontWeight:700,color:"#666",textTransform:"uppercase",letterSpacing:"0.1em"}}>{T.savGoal}</div>
                <div style={{fontSize:13,fontWeight:700,color:"#FFEAA7"}}>${mSav.toFixed(0)} / ${goal}</div>
              </div>
              <div style={{background:"#0D0D15",borderRadius:999,height:10,overflow:"hidden"}}>
                <div style={{height:"100%",borderRadius:999,background:"linear-gradient(90deg,#4ECDC4,#45B7D1)",width:`${Math.min(100,Math.max(0,(mSav/goal)*100))}%`,transition:"width 0.5s ease"}}/>
              </div>
              <div style={{fontSize:11,color:"#555",marginTop:8,textAlign:"right"}}>{Math.round((mSav/goal)*100)}{T.ofGoal}</div>
            </div>
            <div className="card" style={{padding:20,marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:700,color:"#666",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:16}}>{T.calendar}</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:8}}>
                {T.days.map(d=><div key={d} style={{textAlign:"center",fontSize:11,color:"#444",fontWeight:600,padding:"4px 0"}}>{d}</div>)}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
                {Array.from({length:fDay},(_,i)=><div key={`e${i}`}/>)}
                {Array.from({length:dIM},(_,i)=>{
                  const ds=fmt(new Date(cy,cm,i+1));
                  const d=td[ds]||{};
                  const comp=habits.filter(h=>d.habits?.[h.id]).length;
                  const rate=habits.length>0?comp/habits.length:0;
                  const isT=ds===today;
                  const hasTodos=(d.todos||[]).length>0;
                  const doneTodos=(d.todos||[]).filter(t=>t.done).length;
                  return (
                    <div key={ds} className="cday" onClick={()=>{setSel(ds);setView("daily");}}
                      style={{aspectRatio:"1",borderRadius:10,background:isT?"#FF6B3518":"#0D0D15",border:`1.5px solid ${isT?"#FF6B35":"#1A1A25"}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,cursor:"pointer"}}>
                      <div style={{fontSize:13,fontWeight:isT?700:400,color:isT?"#FF6B35":"#aaa"}}>{i+1}</div>
                      {comp>0&&<div style={{width:"60%",height:3,borderRadius:999,background:"linear-gradient(90deg,#FF6B35,#4ECDC4)",opacity:rate}}/>}
                      <div style={{display:"flex",gap:2}}>
                        {(d.incomes||[]).length>0&&<div style={{width:4,height:4,borderRadius:999,background:"#4ECDC4"}}/>}
                        {(d.expenses||[]).length>0&&<div style={{width:4,height:4,borderRadius:999,background:"#FF6B6B"}}/>}
                        {hasTodos&&<div style={{width:4,height:4,borderRadius:999,background:"#9B59B6"}}/>}
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{display:"flex",gap:16,marginTop:12,fontSize:11,color:"#444"}}>
                <span>{T.habLegend}</span><span style={{color:"#4ECDC4"}}>{T.incDot}</span><span style={{color:"#FF6B6B"}}>{T.expDot}</span><span style={{color:"#9B59B6"}}>● Tasks</span>
              </div>
            </div>
            <div className="card" style={{padding:20,marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:700,color:"#666",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:16}}>{T.habMonth}</div>
              {habits.map(h=>{
                const r=hRate(h.id);
                return (
                  <div key={h.id} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{fontSize:13,color:"#888"}}>{h.icon} {h.label}</span>
                      <span style={{fontSize:12,fontWeight:700,color:r>=80?"#4ECDC4":r>=50?"#FFEAA7":"#FF6B6B"}}>{r}%</span>
                    </div>
                    <div style={{background:"#0D0D15",borderRadius:999,height:6,overflow:"hidden"}}>
                      <div style={{height:"100%",borderRadius:999,background:r>=80?"#4ECDC4":r>=50?"#FFEAA7":"#FF6B35",width:`${r}%`,transition:"width 0.5s ease"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
            {mExp>0&&(
              <div className="card" style={{padding:20}}>
                <div style={{fontSize:13,fontWeight:700,color:"#666",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:16}}>{T.dailyExp}</div>
                <div style={{display:"flex",alignItems:"flex-end",gap:3,height:80,paddingBottom:8}}>
                  {dExp.map(d=>{
                    const mx=Math.max(...dExp.map(x=>x.total),1);
                    const h=d.total>0?Math.max(6,(d.total/mx)*70):0;
                    const isT=d.date===today;
                    return (
                      <div key={d.date} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,minWidth:22,flex:1}}>
                        <div style={{width:"100%",height:h,borderRadius:"4px 4px 0 0",background:isT?"#FF6B35":d.total>0?"#FF6B6B88":"transparent"}}/>
                        <div style={{fontSize:9,color:isT?"#FF6B35":"#444",fontWeight:isT?700:400}}>{d.day}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
